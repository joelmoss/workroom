# cargo-about's configuration for the workroom binary's notices (scripts/third_party_notices.py).
#
# The licences a shipped crate may use. A crate under any other fails `make notices-check`: add it
# here only once its terms are understood, and never a copyleft one without the owner. Order
# matters: for a crate offered under a choice ("MIT OR Apache-2.0"), cargo-about takes the first one
# listed here, so the notices carry the shortest terms that apply.
accepted = [
  "MIT",
  "ISC",
  "Zlib",
  "BSD-3-Clause",
  "BSD-2-Clause",
  "Unicode-3.0",
  "CC0-1.0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  # Boost: permissive, not copyleft; its notice is required in source copies only, and the binary's
  # notices carry it anyway. notify 9 links xxhash-rust under it.
  "BSL-1.0",
]

# The targets the binary ships for: the app's Mac binary and its Linux builds for hosts, and the
# standalone archives' (#681). A crate only another platform links (Windows, say) is left out.
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "aarch64-unknown-linux-musl",
  "x86_64-unknown-linux-musl",
]

# Build scripts' and tests' dependencies are not in the binary.
ignore-build-dependencies = true
ignore-dev-dependencies = true

# ring and rustls carry several licences in files cargo-about cannot match on its own.
workarounds = ["ring", "rustls"]
