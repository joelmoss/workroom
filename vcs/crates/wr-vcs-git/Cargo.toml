# Agent Git reads. gix supplies history, refs and object content; owning-host Git supplies exact
# patches and counts with matching comparison/configuration. The original log spike remains a bin.
#
# `default-features = false` is deliberate: the point of preferring gix over git2-rs is that the tree stays free of C-linking
# crates (libgit2-sys / openssl-sys), and gix's default feature set pulls network transports that
# would undo that. Keep the direct dependency free of additional network transports.
#
# It lives in its own crate because wr-vcs-model forbids it by written invariant: "adding gix here
# is a layering violation".
[package]
name = "wr-vcs-git"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# `sha1` is not optional in practice: gix-hash gates its `Kind` enum variants behind it, so with no
# hash feature the enum is empty and gix-hash fails to compile itself. `revision` is what provides
# rev_walk. Both are pure Rust — no C toolchain enters the tree, which is the whole reason for
# preferring gix over git2-rs here.
gix = { version = "0.85", default-features = false, features = ["revision", "sha1"] }
wr-vcs-model = { path = "../wr-vcs-model" }
serde = { workspace = true }
serde_json = "1"
libc = "0.2"
