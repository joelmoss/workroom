# The unified agent: one binary serving both local and remote workrooms.
#
#   `wr-agent serve`  owns ptys and services
#   `wr-agent attach` is the relay libghostty forks as its `config.command`
#
# Mirrors today's shipped `workroom-session daemon|attach` shape deliberately — that shape is
# already debugged, and one binary means the frame codec exists once rather than being duplicated
# in Swift and Rust indefinitely. See docs/designs/remote-workrooms.md, Phase 1.
#
# Excluded from `input_hash()` in vcs/scripts/build-apple.sh (which keys the app's xcframework
# cache and the Xcode `--check` gate) because nothing wr-vcs-uniffi links depends on it. If that
# ever changes, drop the exclusion — edits here would otherwise be invisible to the hash and CI
# would link a stale engine and pass.
#
# VCS reads are a service over wr-vcs-core (JJ) and wr-vcs-git. Backend libraries remain behind
# those crates; the agent owns request framing, capability negotiation and snapshot coordination.
[package]
name = "wr-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
thiserror = { workspace = true }
# Only for the pty and process layers: forkpty, tcgetpgrp, sysctl, proc_pidinfo. No async runtime
# and no C libraries beyond libc itself, so the tree stays as free of native deps as the VCS
# crates are.
libc = "0.2"
serde = { workspace = true }
serde_json = "1"
# Filesystem change notification for the File service (FSEvents on macOS, inotify on Linux). Adding it
# changes Cargo.lock, which `build-apple.sh` hashes, so the first build after this lands rebuilds the
# VCS xcframework once even though nothing wr-vcs-uniffi links changed.
notify = "8"
wr-vcs-core = { path = "../wr-vcs-core" }
wr-vcs-git = { path = "../wr-vcs-git" }
wr-vcs-model = { path = "../wr-vcs-model" }

[dev-dependencies]
# The raw-mode test reads the pty's line discipline directly. `libc` is already a runtime
# dependency, so this adds nothing to the graph — it only makes it visible to `tests/`.
libc = "0.2"

[features]
# Links libghostty-vt so the agent keeps a shadow copy of each session's screen, which is what
# lets a reattaching client be repainted rather than arriving at a blank terminal.
#
# OFF by default, deliberately: it pulls a pinned Zig toolchain, a Ghostty checkout and libclang
# (for bindgen) into the build. Everything else in this crate builds with cargo alone, and that
# stays true for anyone who is not working on terminal state. Turn it on with
# `cargo build -p wr-agent --features terminal-state`; scripts/build-ghostty-vt.sh supplies the
# library and is invoked by build.rs.
terminal-state = ["dep:bindgen"]

[build-dependencies]
bindgen = { version = "0.72", optional = true }

[[bin]]
name = "wr-agent"
path = "src/main.rs"
