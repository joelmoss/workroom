# The unified agent: one binary serving both local and remote workrooms.
#
#   `wr-agent serve`  owns ptys and services
#   `wr-agent attach` is the relay libghostty forks as its `config.command`
#
# Mirrors today's shipped `workroom-session daemon|attach` shape deliberately — that shape is
# already debugged, and one binary means the frame codec exists once rather than being duplicated
# in Swift and Rust indefinitely. See docs/designs/remote-workrooms.md, Phase 1.
#
# VCS reads are a service over wr-vcs-git. The backend library stays behind that crate; the agent
# owns request framing and capability negotiation.
[package]
name = "wr-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
thiserror = { workspace = true }
# Only for the pty and process layers: forkpty, tcgetpgrp, sysctl, proc_pidinfo. No async runtime
# and no C libraries beyond libc itself, except ring for the broker client (below), so the tree
# stays as free of native deps as the VCS crates are.
libc = "0.2"
serde = { workspace = true }
serde_json = "1"
# Filesystem change notification for the File service (FSEvents on macOS, inotify on Linux).
notify = "8"
# The credential broker client (`broker.rs`): HTTPS to Codaset and ES256 proofs. rustls on ring,
# never native-tls, so the Linux build stays a static musl binary with no OpenSSL; ring compiles
# its own C and assembly, which cargo-zigbuild handles for the musl targets. ring also signs the
# proofs, so no separate ECDSA crate. webpki-roots bundles the CA roots, because a minimal
# provider image may have none. Held to 3.4: `broker.rs` rebuilds ureq's default connector chain
# from `ureq::unversioned` (#301), which semver does not cover, so a minor bump must re-check that
# chain against ureq's `DefaultConnector`.
ureq = { version = "~3.4", default-features = false, features = ["rustls"] }
# Parses the broker's expiry and `Date` header.
chrono = { version = "0.4", default-features = false, features = ["std"] }
ring = "0.17"
base64 = "0.22"
wr-protocol = { path = "../wr-protocol" }
wr-vcs-git = { path = "../wr-vcs-git" }
wr-vcs-model = { path = "../wr-vcs-model" }

[dev-dependencies]
# The raw-mode test reads the pty's line discipline directly, and the broker's signal test calls
# sigaction and pthread_kill. `libc` is already a runtime dependency, so this adds nothing to the
# graph — it only makes it visible to `tests/`.
libc = "0.2"

[features]
# Links libghostty-vt so the agent keeps a shadow copy of each session's screen, which is what
# lets a reattaching client be repainted rather than arriving at a blank terminal.
#
# OFF by default, deliberately: it pulls a pinned Zig toolchain, a Ghostty checkout and libclang
# (for bindgen) into the build. Everything else in this crate builds with cargo alone, and that
# stays true for anyone who is not working on terminal state. Turn it on with
# `cargo build -p wr-agent --features terminal-state`; scripts/build-ghostty-vt.sh supplies the
# library and is invoked by build.rs.
terminal-state = ["dep:bindgen"]

[build-dependencies]
bindgen = { version = "0.72", optional = true }

[[bin]]
name = "wr-agent"
path = "src/main.rs"
