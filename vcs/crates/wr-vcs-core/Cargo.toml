[package]
name = "wr-vcs-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# The ONLY crate allowed to depend on jj-lib. jj-only by design: git is handled app-side in Swift
# via SwiftGitX (libgit2), which has no equivalent for jj. App-facing jj reads: log page, changeset.
[dependencies]
wr-vcs-model = { path = "../wr-vcs-model" }
wr-vcs-diff = { path = "../wr-vcs-diff" }
jj-lib = { workspace = true }
thiserror = { workspace = true }
# block_on for jj-lib's async load_at_head (jayjay uses pollster the same way).
pollster = "0.4"
