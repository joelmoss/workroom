# Workroom's Rust workspace: the wr-agent daemon (terminals, VCS and File services) and the
# crates it links for structured git reads. The model crate stays free of any VCS library.
[workspace]
members = [
  "crates/wr-vcs-model",
  "crates/wr-agent",
  "crates/wr-vcs-git",
  "crates/wr-protocol",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/joelmoss/workroom"

# Every member opts in with `[lints] workspace = true`. Each lint here passes today, so the table is
# a floor that stops a regression, not a list of things to sweep. Add one only once the code passes
# it, and never silence one with an `allow` without asking (CONTRIBUTING.md).
[workspace.lints.rust]
unused_lifetimes = "warn"
unused_macro_rules = "warn"

[workspace.lints.clippy]
# Every unsafe block says why it is sound, in a `// SAFETY:` comment just above it, and a SAFETY
# comment sits only on unsafe code.
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
# Pointer casts at the FFI boundary may not quietly add mutability or raise alignment.
as_ptr_cast_mut = "warn"
ptr_cast_constness = "warn"
cast_ptr_alignment = "warn"
# A guard in a `match` or `if let` scrutinee is held until the whole expression ends; with this
# daemon's locks that is a deadlock waiting for the arm that locks again.
significant_drop_in_scrutinee = "warn"
# A forgotten guard or descriptor is never released.
mem_forget = "warn"
# Debugging leftovers.
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[workspace.dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
