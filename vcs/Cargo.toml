# Workroom's Rust workspace: the wr-agent daemon (terminals, VCS and File services) and the
# crates it links for structured git reads. The model crate stays free of any VCS library.
[workspace]
members = [
  "crates/wr-vcs-model",
  "crates/wr-agent",
  "crates/wr-vcs-git",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/joelmoss/workroom"

[workspace.dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
