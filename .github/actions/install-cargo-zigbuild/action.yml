name: Install cargo-zigbuild
description: >-
  Install the pinned cargo-zigbuild, which cross-builds the static Linux workroomd with Zig. Shared
  by the app's daemon build and the Linux daemon jobs, so both link with the same version.

inputs:
  version:
    description: cargo-zigbuild release
    default: "0.23.4"
  cache:
    description: >-
      'false' builds it from source without the cache. Every job whose output is published passes
      it: a restored entry could be poisoned. A tag's run never uses the cache either way, as a tag
      publishes a release.
    default: "true"

runs:
  using: composite
  steps:
    # `cargo install` compiles cargo-zigbuild from source on every run (~1 minute). The binary is
    # all that is installed, so cache it on the pinned version.
    - name: Cache cargo-zigbuild
      id: zigbuild
      if: inputs.cache == 'true' && github.ref_type != 'tag'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cargo/bin/cargo-zigbuild
        key: cargo-zigbuild-${{ runner.os }}-${{ runner.arch }}-${{ inputs.version }}

    - name: Install cargo-zigbuild
      if: steps.zigbuild.outputs.cache-hit != 'true'
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: cargo install cargo-zigbuild --locked --version "$VERSION"
