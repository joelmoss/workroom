name: Set up the daemon build
description: >-
  Prepare a macOS runner to build the workroomd the app bundles, the Linux daemons included: the
  pinned Zig, the pinned Rust (mk/vcs.mk's VCS_RUST) and its targets, and cargo-zigbuild. Shared
  by CI, the nightly and the release, so all three set the build up the same way and the macOS Zig
  checksum lives in one place. The Zig and cargo-zigbuild versions are install-zig's and
  install-cargo-zigbuild's.

inputs:
  targets:
    description: rustup targets to add to the pinned toolchain, space-separated
    required: true
  cache:
    description: >-
      'false' uses no cache: Zig is downloaded and cargo-zigbuild built from source. Every job
      whose output is published passes it: a restored entry could be poisoned. A tag's run never
      uses the cache either way, as a tag publishes a release.
    default: "true"

runs:
  using: composite
  steps:
    # The bundled `workroomd` links libghostty-vt so a reattaching pane can be repainted — see
    # macapp/Scripts/build-daemon.sh. That needs Zig, pinned by version AND checksum for the same
    # reason the Linux daemon jobs pin it: an unpinned toolchain silently changes the terminal
    # emulator the app ships against. The tarball's checksum is verified on every run, cache hit
    # or not.
    - name: Install Zig
      uses: ./.github/actions/install-zig
      with:
        archive: aarch64-macos
        sha256: "75f1bc7a1e9852f17ec9a0c1895f767c4ec56d46bc8a834920eece1d0359dd8d"
        cache: ${{ inputs.cache }}

    # The app bundle carries a static Linux workroomd per arch for remote hosts (issue #227),
    # cross-built by build-daemon.sh with cargo-zigbuild and the Zig above. The toolchain is
    # mk/vcs.mk's VCS_RUST, read through make, which build-daemon.sh builds on: the notices of the
    # Rust runtime the daemon ships pin it too (#714), so the shipped binary is never built by a
    # compiler other than the one they describe. Named explicitly, because a bare
    # `rustup target add` installs into the DEFAULT toolchain.
    - name: Install the pinned Rust and its targets
      shell: bash
      env:
        TARGETS: ${{ inputs.targets }}
      run: |
        toolchain="$(make -s print-VCS_RUST)"
        rustup toolchain install "$toolchain" --profile minimal
        echo "$TARGETS" | xargs rustup target add --toolchain "$toolchain"

    - name: Install cargo-zigbuild
      uses: ./.github/actions/install-cargo-zigbuild
      with:
        cache: ${{ inputs.cache }}
