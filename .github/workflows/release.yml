name: Release

on:
  push:
    tags:
      - "v*"

# Nothing is granted workflow-wide; each job asks for only what it uses.
permissions: {}

# Serialize with the nightly + appcast-notes workflows: all three download-modify-upload the same
# appcast.xml, so overlapping runs could drop items. Queue rather than cancel.
concurrency:
  group: appcast-feed
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # No module cache: this job's output is published, and a restored entry could be poisoned.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Build a Developer ID-signed, notarized, stapled Workroom.dmg and hand it to `publish` as a
  # workflow artifact. Runs in parallel with goreleaser; `publish` waits for both and is what
  # actually attaches the DMG to the release.
  # Requires repo secrets: MACOS_CERTIFICATE / MACOS_CERTIFICATE_PWD
  # (base64 .p12 + password), KEYCHAIN_PASSWORD, and the App Store Connect notary API key
  # NOTARY_KEY / NOTARY_KEY_ID / NOTARY_ISSUER_ID.
  # Optional: SENTRY_AUTH_TOKEN / SENTRY_ORG / SENTRY_PROJECT enable Sentry dSYM upload so release
  # crashes symbolicate; release.sh skips that step when any of them (or sentry-cli) is absent.
  macapp:
    runs-on: xcode-27
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # Xcode, Go (Scripts/build-helper.sh compiles + embeds the workroom CLI into the app bundle)
      # and XcodeGen + create-dmg + sentry-cli. sentry-cli uploads dSYMs in release.sh (skipped
      # there if the Sentry env vars are unset). No module cache: this job's output is published,
      # and a restored entry could be poisoned.
      - name: Set up the app build
        uses: ./.github/actions/setup-app-build
        with:
          go-cache: "false"
          formulae: xcodegen create-dmg getsentry/tools/sentry-cli

      # Zig, the darwin and Linux daemon targets (Homebrew rust can't cross-compile, hence
      # rustup's), and cargo-zigbuild, downloaded and built rather than restored: this job's output
      # is published.
      - name: Set up the daemon build
        uses: ./.github/actions/setup-daemon-build
        with:
          targets: aarch64-apple-darwin aarch64-unknown-linux-musl x86_64-unknown-linux-musl
          cache: "false"

      - name: Import Developer ID signing certificate
        uses: ./.github/actions/import-signing-certificate
        with:
          certificate: ${{ secrets.MACOS_CERTIFICATE }}
          certificate-password: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          keychain-password: ${{ secrets.KEYCHAIN_PASSWORD }}

      - name: Build, sign, notarize, staple, package DMG
        env:
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          # Sparkle: injects the tag as the app version and EdDSA-signs the DMG for the appcast.
          # Empty until the secret is added — release.sh then skips signing (DMG still ships).
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          VERSION: ${{ github.ref_name }}
          # Sentry dSYM upload (optional — release.sh skips when any is empty). ORG/PROJECT are
          # slugs, not secrets, but kept as secrets here to match this job's convention.
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: |
          echo "$NOTARY_KEY" | openssl base64 -d -A > "$RUNNER_TEMP/notary.p8"
          make app-package-test
          NOTARY_KEY_PATH="$RUNNER_TEMP/notary.p8" make app-test APP_SIGN_FLAGS="CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=YES DEVELOPMENT_TEAM="
          NOTARY_KEY_PATH="$RUNNER_TEMP/notary.p8" make app-release

      - name: Preserve signed installer for publication
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-macapp
          path: |
            macapp/build/release/Workroom.dmg
            macapp/build/release/appcast-fields.env
          if-no-files-found: error
          # v4 artifact names are unique per RUN, not per attempt, and this action fails by
          # default when the name already exists — so "Re-run all jobs" would rebuild and
          # re-notarize for ~40min and then die on this step.
          overwrite: true
          # 7, not 1: GitHub allows job re-runs for 30 days, and this artifact is the ONLY copy of
          # the notarized DMG — a publish that fails Friday must still be retryable on Monday
          # without re-running the whole signed macOS build.
          retention-days: 7
          compression-level: 0

  # Build both platforms concurrently; publish the app only after both jobs succeed.
  publish:
    needs: [release, macapp]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # download-stats.sh pushes its snapshot with these credentials.
          persist-credentials: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-macapp
          path: macapp/build/release

      # appcast.sh clobbers appcast.xml below, resetting its poll count; read it first
      # (download-stats.yml). Never blocks the release: a missed snapshot costs stats, not a ship.
      - name: Snapshot download counts before the clobber
        continue-on-error: true
        env:
          REPO: ${{ github.repository }}
        run: scripts/ci/download-stats.sh release

      - name: Upload installer to the release
        run: |
          # Name matches the CLI archives' scheme; ${GITHUB_REF_NAME#v} drops the tag's leading
          # v so it lines up with goreleaser's {{ .Version }} (e.g. workroom-macos-app_1.4.0.dmg).
          ASSET="$RUNNER_TEMP/workroom-macos-app_${GITHUB_REF_NAME#v}.dmg"
          cp macapp/build/release/Workroom.dmg "$ASSET"
          gh release upload "$GITHUB_REF_NAME" "$ASSET" --clobber

      - name: Publish Sparkle appcast
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: macapp/Scripts/appcast.sh
