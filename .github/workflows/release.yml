name: Release

on:
  push:
    tags:
      - "v*"

# Nothing is granted workflow-wide; each job asks for only what it uses.
permissions: {}

# Serialize with the nightly + appcast-notes workflows: all three download-modify-upload the same
# appcast.xml, so overlapping runs could drop items. Queue rather than cancel.
concurrency:
  group: appcast-feed
  cancel-in-progress: false

jobs:
  # Build a Developer ID-signed, notarized, stapled Workroom.dmg and the standalone `workroom`
  # archives (macapp/Scripts/cli-archives.sh: the Rust binary, which is the CLI and the daemon, for
  # darwin and linux on arm64 and amd64, under goreleaser's names, with checksums.txt; ADR 0078),
  # and hand them to `publish` as a workflow artifact. `publish` creates the GitHub release.
  # Requires repo secrets: MACOS_CERTIFICATE / MACOS_CERTIFICATE_PWD
  # (base64 .p12 + password), KEYCHAIN_PASSWORD, and the App Store Connect notary API key
  # NOTARY_KEY / NOTARY_KEY_ID / NOTARY_ISSUER_ID.
  # Optional: SENTRY_AUTH_TOKEN / SENTRY_ORG / SENTRY_PROJECT enable Sentry dSYM upload so release
  # crashes symbolicate; release.sh skips that step when any of them (or sentry-cli) is absent.
  macapp:
    runs-on: xcode-27
    # The app took about 60 minutes before #681; the standalone archives add four builds, a
    # notarization and the contract suite's build.
    timeout-minutes: 150
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # Xcode and XcodeGen + create-dmg + sentry-cli. sentry-cli uploads dSYMs in release.sh
      # (skipped there if the Sentry env vars are unset).
      - name: Set up the app build
        uses: ./.github/actions/setup-app-build
        with:
          formulae: xcodegen create-dmg getsentry/tools/sentry-cli

      # Zig, the darwin and Linux targets (Homebrew rust can't cross-compile, hence rustup's), and
      # cargo-zigbuild, downloaded and built rather than restored: this job's output is published.
      # x86_64-apple-darwin is the standalone archive's alone: the app is arm64 (ADR 0061).
      - name: Set up the daemon build
        uses: ./.github/actions/setup-daemon-build
        with:
          targets: >-
            aarch64-apple-darwin x86_64-apple-darwin
            aarch64-unknown-linux-musl x86_64-unknown-linux-musl
          cache: "false"

      # cli-archives.sh runs every darwin binary it ships before anything publishes: the x86_64
      # one under Rosetta.
      - name: Install Rosetta (runs the darwin amd64 binary)
        run: sudo softwareupdate --install-rosetta --agree-to-license

      - name: Import Developer ID signing certificate
        uses: ./.github/actions/import-signing-certificate
        with:
          certificate: ${{ secrets.MACOS_CERTIFICATE }}
          certificate-password: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          keychain-password: ${{ secrets.KEYCHAIN_PASSWORD }}

      - name: Build, sign, notarize, staple, package DMG
        env:
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          # Sparkle: injects the tag as the app version and EdDSA-signs the DMG for the appcast.
          # Empty until the secret is added — release.sh then skips signing (DMG still ships).
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          VERSION: ${{ github.ref_name }}
          # Sentry dSYM upload (optional — release.sh skips when any is empty). ORG/PROJECT are
          # slugs, not secrets, but kept as secrets here to match this job's convention.
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: |
          echo "$NOTARY_KEY" | openssl base64 -d -A > "$RUNNER_TEMP/notary.p8"
          make app-package-test
          # none: the swap's hand-off test moves this build's own daemon; ci-app.yml's `app` job
          # runs it against the pre-swap one, which this job does not build.
          TEST_RUNNER_WR_FORMER_DAEMON=none \
            NOTARY_KEY_PATH="$RUNNER_TEMP/notary.p8" make app-test APP_SIGN_FLAGS="CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=YES DEVELOPMENT_TEAM="
          # Not cli-archives_test.sh: it builds both channels' archives to test the script the next
          # step runs for real, and CI's app-scripts job runs it.
          NOTARY_KEY_PATH="$RUNNER_TEMP/notary.p8" make app-release \
            APP_SCRIPT_TESTS_SKIP=macapp/Scripts/cli-archives_test.sh

      # The standalone archives: the same Rust binary the app bundles, built with the same
      # toolchain and features for each platform, the darwin ones signed with the Developer ID and
      # notarized, under goreleaser's names so install.sh and every Go CLI's `workroom update` reach
      # it. cli-archives.sh checks what it wrote: no Go binary, no Windows build.
      - name: Build, sign, notarize the standalone archives
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          VERSION: ${{ github.ref_name }}
          CODESIGN_IDENTITY: Developer ID Application
        run: NOTARY_KEY_PATH="$RUNNER_TEMP/notary.p8" macapp/Scripts/cli-archives.sh build macapp/build/release/cli

      # The CLI contract suite against the binary this release ships, unpacked from its archive.
      - name: Test (contract suite against the shipped binary)
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          SHIPPED="$RUNNER_TEMP/shipped"
          mkdir "$SHIPPED"
          tar -xzf "macapp/build/release/cli/workroom_${VERSION#v}_darwin_arm64.tar.gz" -C "$SHIPPED"
          WORKROOM_BIN="$SHIPPED/workroom" rustup run "$(make -s print-VCS_RUST)" \
            cargo test --manifest-path vcs/Cargo.toml -p workroom --test commands_contract

      - name: Preserve signed installer for publication
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-macapp
          path: |
            macapp/build/release/Workroom.dmg
            macapp/build/release/appcast-fields.env
            macapp/build/release/cli/
          if-no-files-found: error
          # v4 artifact names are unique per RUN, not per attempt, and this action fails by
          # default when the name already exists — so "Re-run all jobs" would rebuild and
          # re-notarize for ~40min and then die on this step.
          overwrite: true
          # 7, not 1: GitHub allows job re-runs for 30 days, and this artifact is the ONLY copy of
          # the notarized DMG — a publish that fails Friday must still be retryable on Monday
          # without re-running the whole signed macOS build.
          retention-days: 7
          compression-level: 0

  # Create the GitHub release with the archives and the DMG, then the appcast.
  publish:
    needs: [macapp]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # download-stats.sh pushes its snapshot with these credentials.
          persist-credentials: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-macapp
          path: macapp/build/release

      # appcast.sh clobbers appcast.xml below, resetting its poll count; read it first
      # (download-stats.yml). Never blocks the release: a missed snapshot costs stats, not a ship.
      - name: Snapshot download counts before the clobber
        continue-on-error: true
        env:
          REPO: ${{ github.repository }}
        run: scripts/ci/download-stats.sh release

      # cli-archives.sh check, which publish-assets.sh runs first, runs the linux binaries: the
      # arm64 one under qemu (`qemu-aarch64`). `qemu-user`, not `qemu-user-static`, which Ubuntu
      # 26.04 (ubuntu-latest) dropped, as in ci-rust.yml: a static binary needs no static qemu.
      - name: Install qemu-user (runs the linux arm64 binary)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq qemu-user

      # Creates the release as a draft, uploads the archives, checksums.txt and the DMG, checks
      # they are exactly this build's, then publishes it: Latest for a clean vX.Y.Z, a pre-release
      # for a prerelease tag. A re-run replaces the files of the release it finds.
      - name: Publish the release
        run: |
          # Name matches the CLI archives' scheme; ${GITHUB_REF_NAME#v} drops the tag's leading
          # v so it lines up with the archives' version (e.g. workroom-macos-app_1.4.0.dmg).
          ASSET="$RUNNER_TEMP/workroom-macos-app_${GITHUB_REF_NAME#v}.dmg"
          cp macapp/build/release/Workroom.dmg "$ASSET"
          macapp/Scripts/publish-assets.sh "$GITHUB_REF_NAME" macapp/build/release/cli "$ASSET"

      - name: Publish Sparkle appcast
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: macapp/Scripts/appcast.sh
