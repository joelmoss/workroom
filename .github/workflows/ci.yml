name: CI

on:
  push:
    # `release/**` are the maintenance branches patch releases are cut from (CONTRIBUTING "Patch
    # releases"). They get the same gate as master — a v2.0.1 tag pushed there triggers a real
    # release, so it must not be the first CI that branch has seen.
    branches: [master, "release/**"]
  pull_request:
    branches: [master, "release/**"]

# Superseded PR pushes stop burning a macOS runner. Branch pushes keep every run so each commit a
# release can be cut from — on master or a `release/**` branch — has its own signal.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Pinned to jj-lib's version in vcs/Cargo.toml — bump both together. This is the ONLY jj version
# `app` (macOS, 10x the runner cost) installs — `cli` and `vcs-core` (cheap Linux jobs) instead
# matrix over several jj CLI versions (see their own `strategy:` comments), since that's where a
# real skew bug was caught (2026-08-16): fixtures shelling to `jj` assumed 0.44-only behavior and
# silently broke on 0.43 without any CI signal until this version was exercised end to end.
env:
  JJ_VERSION: 0.43.0

jobs:
  # Keep the workflow/check names present for branch protection. Only standalone website
  # changes skip suites; unknown paths and unavailable history always run everything.
  changes:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.changes.outputs.run }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Run the BASE branch's selector, never the PR's own. This job decides whether the
      # native jobs run at all, and GitHub counts a conditionally-SKIPPED required check as
      # passing — so a PR that edited changes.py to emit `run=false` (its `__main__` line alone,
      # leaving should_run() and every test untouched) would merge green with no native coverage.
      # Deleting ci.yml outright blocks a merge; silencing the gate would not. No-op on a push,
      # where github.sha is already the trusted commit.
      # Absent on the base ref when that ref predates the selector — the PR introducing it (this
      # one) included. No trusted selector means NO gate: the two steps below are skipped, `run`
      # stays empty, and the `!= 'false'` tests on the native jobs all pass, so everything
      # runs. Never fall back to the PR's own copy; that is the bypass this whole step exists for.
      - name: Restore the trusted selector
        id: selector
        env:
          TRUSTED_REF: ${{ github.event.pull_request.base.sha || github.sha }}
        run: |
          if git checkout "$TRUSTED_REF" -- scripts/ci 2>/dev/null; then
            echo "trusted=true" >> "$GITHUB_OUTPUT"
          else
            echo "trusted=false" >> "$GITHUB_OUTPUT"
            echo "::notice::no scripts/ci at $TRUSTED_REF — change gate disabled, running every suite"
          fi

      # Named file, not `unittest discover -s scripts/ci`: discover exits 0 when it finds NO
      # tests, so a deleted or renamed suite would report green while proving nothing about the
      # gate that can switch every native job off.
      - name: Test change selection
        if: steps.selector.outputs.trusted == 'true'
        run: python3 scripts/ci/test_changes.py

      - id: changes
        if: steps.selector.outputs.trusted == 'true'
        env:
          DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          DIFF_HEAD: ${{ github.sha }}
        run: python3 scripts/ci/changes.py >> "$GITHUB_OUTPUT"

  cli:
    needs: changes
    if: always() && !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.run != 'false')
    runs-on: ubuntu-latest
    # Matrix over jj CLI versions the Go tests shell out to (see the "Install jj" step below) —
    # NOT the same axis as $JJ_VERSION above, which stays the single version `app`'s fixed-cost
    # macOS job installs. This caught a real bug (2026-08-16): fixtures shelling to `jj` assumed
    # 0.44's "auto-advance @ off an immutable tip after push" and silently broke on 0.43, where
    # `jj` behaves differently. Keep this list and vcs-core's in sync — both exercise the same
    # CLI-shelling concern from different languages. Bump when jj cuts a new release worth
    # covering; no need to chase every patch release.
    strategy:
      fail-fast: false
      matrix:
        jj-version: ["0.43.0", "0.44.0"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # `jj` is what TestAddProjectCreate_ExistingJJRepoUsedAsIs / TestDeleteProjectSafetyJJ_* shell
      # out to — both `t.Skip` silently without it, so without this step they never ran in CI at
      # all. Same pattern as the `vcs-core` job below (apt has no jj package, hence the release
      # tarball).
      - name: Install jj
        env:
          JJ_VERSION: ${{ matrix.jj-version }}
        run: |
          curl -fsSL "https://github.com/jj-vcs/jj/releases/download/v$JJ_VERSION/jj-v$JJ_VERSION-x86_64-unknown-linux-musl.tar.gz" \
            | sudo tar -xz -C /usr/local/bin ./jj
          jj --version

      # jj only affects tests, so the three steps below run once, on the first matrix leg.
      # `strategy.job-index`, NOT a `matrix.jj-version == env.JJ_VERSION` comparison: JJ_VERSION
      # tracks the jj-lib pin and this list tracks jj CLI releases, on different cadences — the
      # first bump that leaves them disjoint would make such an `if` false on EVERY leg and
      # silently delete the lint, format and cross-compile gates with CI still green. An index
      # always matches exactly one leg however either value moves.
      #
      # Uses a prebuilt linter instead of compiling it and downloading its Go toolchain per runner.
      #
      # The pin must stay on golangci-lint /v2: v1 rejects the v2-format .golangci.yml and its
      # vendored go/types cannot analyze a Go 1.27 stdlib at all. The constraint when bumping is
      # *directional* — the linter's typechecker must be at least as new as the Go whose code it
      # reads (older cannot decode newer export data; that is what killed v1 here), so a linter
      # built by a NEWER Go than the module targets is correct, not a mismatch.
      - name: Lint
        if: strategy.job-index == 0
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

      # v2 moved formatters out of `run`, so `run` alone reports NO gofmt/goimports findings and
      # the formatting gate would be silently lost. Keep in step with the Makefile's cli-lint.
      - name: Format
        if: strategy.job-index == 0
        run: golangci-lint fmt --diff

      # Includes the native Linux build; no separate unused binary is necessary.
      #
      # Why this gate exists: releases (goreleaser) and the nightly archives ship windows/linux
      # builds, but this job only ever compiled for the runner. A unix-only syscall (Setpgid,
      # syscall.Kill) therefore passed CI and broke the nightly + the next tag.
      - name: Cross-compile check
        if: strategy.job-index == 0
        run: |
          for os in windows linux darwin; do
            GOOS="$os" GOARCH=amd64 go build -o /dev/null .
          done

      - name: Test
        run: go test ./...

  # The Rust VCS core's own tests (jj-lib reads against real throwaway jj repos, incl. the
  # working-copy snapshot + conflict classification). Its own Linux job rather than a step in `app`:
  # off the macOS critical path (it was ~3min of it on a cold run), Linux minutes are 10x cheaper,
  # and it's the only thing testing the core away from Apple targets.
  vcs-core:
    needs: changes
    if: always() && !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.run != 'false')
    runs-on: ubuntu-latest
    # Matrix over the jj CLI version the working_status fixtures shell out to for repo setup —
    # see the `cli` job's comment for why this axis exists and is independent of $JJ_VERSION/the
    # exact jj-lib pin in vcs/Cargo.toml. Also exercises jj-lib (always the pinned crate version)
    # reading a repo laid out by a DIFFERENT jj CLI version — a real forward/backward-compat
    # question given jj's on-disk format has changed across releases. Keep this list in sync with
    # `cli`'s.
    strategy:
      fail-fast: false
      matrix:
        jj-version: ["0.43.0", "0.44.0"]
    steps:
      - uses: actions/checkout@v5

      # protoc is a build-time dep of jj-lib. The `jj` CLI is what the working_status fixtures shell
      # out to for repo setup (and the test SKIPS silently without it, so it must be installed) —
      # apt has no jj package, hence the release tarball.
      - name: Install protoc + jj
        env:
          JJ_VERSION: ${{ matrix.jj-version }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler
          curl -fsSL "https://github.com/jj-vcs/jj/releases/download/v$JJ_VERSION/jj-v$JJ_VERSION-x86_64-unknown-linux-musl.tar.gz" \
            | sudo tar -xz -C /usr/local/bin ./jj
          jj --version

      # Pinned for the lint gates below, unlike the `app` job (which deliberately tracks the runner's
      # rustc so a toolchain bump invalidates its output cache). rustfmt's layout and clippy's lint set
      # both change between releases, so an unpinned toolchain makes `--check` and `-D warnings` fail
      # when GitHub rolls its image rather than when someone's code is wrong. Same reasoning as the
      # pinned golangci-lint in `cli`. Keep in step with the local toolchain.
      - name: Install Rust 1.96.1
        run: |
          rustup toolchain install 1.96.1 --profile minimal --component rustfmt,clippy
          rustup default 1.96.1

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: vcs

      # Ordered cheapest-first so a formatting nit doesn't wait on the jj-lib crate graph. Both run
      # once, on the first matrix leg — see `cli`'s Lint step for why that's an index, not a
      # comparison against $JJ_VERSION.
      - name: Format
        if: strategy.job-index == 0
        run: cargo fmt --manifest-path vcs/Cargo.toml --all -- --check

      - name: Clippy
        if: strategy.job-index == 0
        run: cargo clippy --manifest-path vcs/Cargo.toml --workspace --all-targets -- -D warnings

      # This already covers wr-agent, and covers it on LINUX — the workspace has no
      # `default-members`, so every member's unit and integration tests run here. That matters
      # because the agent's pty, /proc introspection and socket code are the parts most likely to
      # differ between Darwin and Linux, and a bug that only shows up on one of them has already
      # happened once (an output pump that never noticed a closed socket, which macOS hid).
      - name: Test
        run: cargo test --manifest-path vcs/Cargo.toml

  # The shadow terminal, which is what makes a reattaching client see its screen. Separate from
  # `vcs-core` because it is the only thing in the repo that needs a Zig toolchain and a Ghostty
  # checkout, and the rest of the workspace should not wait on either.
  agent-terminal-state:
    needs: changes
    if: always() && !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.run != 'false')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        run: |
          rustup toolchain install 1.96.1 --profile minimal --component clippy
          rustup default 1.96.1

      # Pinned by version AND checksum. An unpinned toolchain would silently change the emulator
      # this links, and the snapshot format it produces carries no compatibility guarantee.
      - name: Install Zig
        env:
          ZIG_VERSION: "0.16.0"
          ZIG_SHA256: "70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00"
        run: |
          url="https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          curl -fsSL "$url" -o zig.tar.xz
          echo "${ZIG_SHA256}  zig.tar.xz" | sha256sum -c -
          mkdir -p "$HOME/.zig" && tar -xJf zig.tar.xz -C "$HOME/.zig" --strip-components=1
          echo "$HOME/.zig" >> "$GITHUB_PATH"

      # Keyed on the pinned engine sha, so a bump refetches and rebuilds and nothing else does.
      # Without this every run clones Ghostty and spends ~75s building the emulator.
      - name: Cache libghostty-vt
        uses: actions/cache@v4
        with:
          path: ~/.cache/workroom/ghostty-vt
          key: ghostty-vt-${{ runner.os }}-${{ hashFiles('vcs/scripts/build-ghostty-vt.sh') }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: vcs

      - name: Clippy
        run: |
          cargo clippy --manifest-path vcs/Cargo.toml -p wr-agent \
            --features terminal-state --all-targets -- -D warnings

      # WR_AGENT_HAS_TERMINAL_STATE tells the integration tests the agent under test was built
      # with the feature, so the repaint and scrollback assertions run instead of skipping. Without
      # it they would pass by skipping and this job would prove nothing.
      - name: Test
        env:
          WR_AGENT_HAS_TERMINAL_STATE: "1"
        run: cargo test --manifest-path vcs/Cargo.toml -p wr-agent --features terminal-state

  # The Linux agents Workroom.app ships for remote hosts (issue #227), built the way the app bundle
  # builds them (cargo-zigbuild, static musl, terminal-state) and then RUN. The Mac-side check in
  # build-agent_test.sh can only see that each ELF is static and the right arch, not that it starts.
  # aarch64 runs under qemu-user, which needs no sysroot for a static binary.
  agent-linux:
    needs: changes
    if: always() && !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.run != 'false')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    env:
      TARGET: ${{ matrix.arch }}-unknown-linux-musl
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        run: |
          rustup toolchain install 1.96.1 --profile minimal --target "$TARGET"
          rustup default 1.96.1

      # Pinned by version AND checksum, as in `agent-terminal-state`. cargo-zigbuild links with it
      # and libghostty-vt is built with it.
      - name: Install Zig
        env:
          ZIG_VERSION: "0.16.0"
          ZIG_SHA256: "70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00"
        run: |
          url="https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          curl -fsSL "$url" -o zig.tar.xz
          echo "${ZIG_SHA256}  zig.tar.xz" | sha256sum -c -
          mkdir -p "$HOME/.zig" && tar -xJf zig.tar.xz -C "$HOME/.zig" --strip-components=1
          echo "$HOME/.zig" >> "$GITHUB_PATH"

      # Its own key per arch. Sharing `agent-terminal-state`'s key would restore that job's glibc
      # prefix, count as a hit, never save the musl one, and rebuild it on every run.
      - name: Cache libghostty-vt
        uses: actions/cache@v4
        with:
          path: ~/.cache/workroom/ghostty-vt
          key: ghostty-vt-${{ runner.os }}-${{ env.TARGET }}-${{ hashFiles('vcs/scripts/build-ghostty-vt.sh') }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: vcs
          key: ${{ env.TARGET }}

      - name: Install cargo-zigbuild and qemu
        run: |
          cargo install cargo-zigbuild --locked --version 0.23.4
          if [ "${{ matrix.arch }}" = aarch64 ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq qemu-user-static
          fi

      - name: Build
        run: |
          cargo zigbuild --manifest-path vcs/Cargo.toml --release -p wr-agent \
            --features terminal-state --target "$TARGET"

      - name: Check
        run: |
          bin="vcs/target/$TARGET/release/wr-agent"
          file "$bin"
          file -b "$bin" | grep -q 'statically linked'
          run=""
          if [ "${{ matrix.arch }}" = aarch64 ]; then run=qemu-aarch64-static; fi
          out="$($run "$bin" protocol)"
          echo "$out"
          echo "$out" | grep -q '^protocol '
          echo "$out" | grep -qx 'terminal-state yes'

      # The persistent remote path over real ssh (issue #228): this ELF, supervised in a container
      # with sshd, driven from the runner by the ignored `over_ssh_*` tests in remote_transport.rs.
      # x86_64 only, because the runner is x86_64: the aarch64 ELF would need an emulated container.
      # Bounded, because an agent that wedges mid-reply would hang an ssh call with no deadline of
      # its own, and the job's default timeout is six hours.
      - name: ssh fixture
        if: matrix.arch == 'x86_64'
        timeout-minutes: 15
        run: vcs/scripts/ssh-fixture/run.sh "vcs/target/$TARGET/release/wr-agent"

  app:
    needs: changes
    if: always() && !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.run != 'false')
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      # Xcode 16+ bundles swift-format (used by `make app-lint`) and builds for macOS 14+.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # Scripts/build-helper.sh compiles + embeds the workroom CLI during the test build.
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # XcodeGen generates the (gitignored) .xcodeproj. protobuf provides protoc, a build-time
      # dependency of jj-lib (the Rust VCS core, built by `make app-vcs`). aws/tap ships
      # pre-tapped but untrusted on the runner image, which makes every `brew install` on this
      # job emit a "tap trust" warning annotation unrelated to our formulae.
      - name: Install XcodeGen + protobuf
        run: |
          brew untap aws/tap
          brew install xcodegen protobuf

      # jj (Jujutsu) is required by WorkroomStatusIntegrationTests, which exercise the VCS status
      # resolver against real git + jj repos. git + gh are preinstalled on the runner; jj is not.
      # Installed from the pinned release tarball (same mechanism as the `cli`/`vcs-core` jobs
      # above) rather than `brew install jj`, so this job tracks the same $JJ_VERSION instead of
      # whatever Homebrew resolves that day. macos-15 runners are Apple Silicon (arm64).
      - name: Install jj
        run: |
          curl -fsSL "https://github.com/jj-vcs/jj/releases/download/v$JJ_VERSION/jj-v$JJ_VERSION-aarch64-apple-darwin.tar.gz" \
            | sudo tar -xz -C /usr/local/bin ./jj
          jj --version

      - name: Lint (swift-format --strict)
        run: make app-lint

      # The app bundles `wr-agent`, and the bundled build links libghostty-vt so a reattaching
      # pane can be repainted — see macapp/Scripts/build-agent.sh. That needs a Zig toolchain on
      # this runner too, pinned by version AND checksum for the same reason the Linux agent job
      # pins it: an unpinned toolchain silently changes the emulator the app ships against.
      - name: Install Zig
        env:
          ZIG_VERSION: "0.16.0"
          ZIG_SHA256: "b23d70deaa879b5c2d486ed3316f7eaa53e84acf6fc9cc747de152450d401489"
        run: |
          url="https://ziglang.org/download/${ZIG_VERSION}/zig-aarch64-macos-${ZIG_VERSION}.tar.xz"
          curl -fsSL "$url" -o zig.tar.xz
          echo "${ZIG_SHA256}  zig.tar.xz" | shasum -a 256 -c -
          mkdir -p "$HOME/.zig" && tar -xJf zig.tar.xz -C "$HOME/.zig" --strip-components=1
          echo "$HOME/.zig" >> "$GITHUB_PATH"

      # Keyed on the pinned engine sha, as in `agent-terminal-state`: a bump refetches and
      # rebuilds, nothing else does.
      - name: Cache libghostty-vt
        uses: actions/cache@v4
        with:
          path: ~/.cache/workroom/ghostty-vt
          key: ghostty-vt-${{ runner.os }}-${{ hashFiles('vcs/scripts/build-ghostty-vt.sh') }}

      # The Rust VCS core (jj-lib via UniFFI) the app links. `make app-vcs` runs
      # vcs/scripts/build-apple.sh to produce the WrVcs package's xcframework + Swift bindings, and
      # MUST run before SPM resolves that local package below. Rust is preinstalled on the runner.
      #
      # Use the build script's own freshness hash so CI and local builds share exactly
      # the same inputs. Agent and experimental Git crate sources do not affect this library.
      - name: VCS core input hash
        id: vcs-input
        run: |
          hash=$(vcs/scripts/build-apple.sh --print-input-hash)
          echo "hash=$hash" >> "$GITHUB_OUTPUT"

      - name: Cache VCS core outputs
        id: vcs-core
        uses: actions/cache@v4
        with:
          path: |
            vcs/swift/WrVcs/Frameworks
            vcs/swift/WrVcs/Sources/WrVcs/wr_vcs_uniffi.swift
            vcs/swift/WrVcs/Sources/wr_vcs_uniffiFFI/include
          key: wrvcs-${{ runner.os }}-${{ runner.arch }}-${{ steps.vcs-input.outputs.hash }}

      # Xcode still builds wr-agent when the VCS framework hits its output cache.
      # Always restore Cargo dependencies; v2 avoids old entries saved without the agent build.
      - name: Cache cargo (VCS core + agent)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: vcs
          key: app-agent-v2

      - name: Build VCS core (Rust → xcframework + Swift bindings)
        if: steps.vcs-core.outputs.cache-hit != 'true'
        run: make app-vcs

      # SPM resolves ~15 packages (Sparkle, Sentry, libghostty, the tree-sitter grammars, and
      # swift-syntax pulled transitively) by cloning them from GitHub on every run. Cache the
      # resolved checkouts keyed on project.yml AND the tracked Package.resolved (checkout already
      # places this one file — the rest of the gitignored .xcodeproj doesn't exist yet) so an
      # unchanged set skips the network entirely. Package.resolved is in the key, not just
      # project.yml, because a pin can be re-reviewed to a different revision under the SAME
      # version string (GhosttyPinIntegrityTests exists for exactly this: the packager has re-cut an
      # already-published tag before) — keying on project.yml alone let a stale cache silently keep
      # serving the old revision after such a bump, failing that test on every run until the cache
      # aged out.
      #
      # Deliberately NO restore-keys fallback: a fuzzy prefix match can restore an older cache whose
      # checked-out `workspace-state.json` disagrees with the CURRENT Package.resolved — and SPM
      # trusts that already-resolved state over reconciling against the file, so a exact-key miss
      # silently re-served the stale revision anyway (reproduced on run 33511971205, right after
      # adding Package.resolved to the key above got this far). Paying the network cost in full on
      # every exact-key miss is the correct tradeoff: it's rare (only a real dependency change), and
      # it's exactly the situation this cache must not paper over.
      - name: Cache SPM packages
        id: spm
        uses: actions/cache@v4
        with:
          path: macapp/DerivedData/SourcePackages
          key: >-
            spm-${{ runner.os }}-${{
            hashFiles('macapp/project.yml', 'macapp/WorkroomApp.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved')
            }}

      # Compiling the dependency graph — libgit2 (429 tasks), SwiftGitX, the tree-sitter grammars,
      # Sentry, Sparkle, swift-syntax — is ~60% of the build's work and none of it changes between
      # runs. Caching the build dir lets xcodebuild's incremental check reuse those objects; only our
      # own sources rebuild (checkout gives them fresh mtimes, while the restored dep checkouts keep
      # their original ones, so the dependency objects stay up to date).
      #
      # Deliberately NO run-id suffix or restore-keys: the key is exactly what the dep objects depend
      # on (compiler + the dependency set), so the first run saves and every later run hits without
      # paying to re-upload ~500MB each time. actions/cache is post-if success(), so a failed build's
      # dir is never saved.
      - name: Xcode version (cache key input)
        id: xcode
        run: |
          # e.g. "Xcode 26.0" + "Build version 17A324" → "26.0-17A324".
          echo "version=$(xcodebuild -version | awk 'NR==1{v=$2} NR==2{b=$NF} END{print v "-" b}')" >> "$GITHUB_OUTPUT"

      - name: Cache Xcode build dir
        uses: actions/cache@v4
        with:
          path: macapp/DerivedData/Build
          key: >-
            xcbuild-${{ runner.os }}-${{ steps.xcode.outputs.version }}-${{
            hashFiles('macapp/project.yml', 'macapp/WorkroomApp.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      # Resolve up front with retries so a transient github.com blip mid-clone can't fail the whole
      # run (it did: swift-syntax clone hit "Couldn't connect to server"). The subsequent app-test
      # build reuses these checkouts via the same -clonedSourcePackagesDirPath, so it won't re-clone.
      #
      # Skipped on an exact cache hit: there's nothing to clone, so the whole step (~25s, including an
      # xcodegen run that `make app-test` does again anyway) is pure overhead. A restore-keys-only
      # (partial) restore reports no cache-hit, so a dependency change still resolves here, retries
      # and all.
      - name: Resolve SPM packages (retry on network flake)
        if: steps.spm.outputs.cache-hit != 'true'
        working-directory: macapp
        run: |
          xcodegen generate
          for attempt in 1 2 3; do
            xcodebuild -project WorkroomApp.xcodeproj -scheme WorkroomApp \
              -derivedDataPath DerivedData -clonedSourcePackagesDirPath DerivedData/SourcePackages \
              -resolvePackageDependencies && exit 0
            echo "::warning::SPM resolve attempt $attempt failed; retrying in 15s"
            sleep 15
          done
          echo "::error::SPM resolve failed after 3 attempts"; exit 1

      # Hosted runners have no signing cert / dev team: ad-hoc sign, clear the team, manual
      # style so xcodebuild won't provision against Apple's servers. Lets the non-sandboxed
      # app build and the unit tests launch their host app. (`make app-test` also builds.)
      - name: Test
        run: >-
          make app-test
          APP_SIGN_FLAGS="CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=YES DEVELOPMENT_TEAM="

      # Parallel xcodebuild prints NO assertion text — just a `Failing tests:` list — so a red run
      # here says WHICH test failed and nothing about why. The message only exists in the xcresult,
      # which is why diagnosing nightly 33955949260's failure needed a local repro instead of a read.
      - name: Upload test results (xcresult)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult-ci
          path: macapp/DerivedData/Logs/Test/*.xcresult
          retention-days: 7

      # The supervisor PTY integration test (issue #7) drives the real supervisor.sh under a pty with
      # a fake server — the only gate on the no-orphan / no-"already running" behaviour the Swift unit
      # tests (mocked seam) can't see. python3 is preinstalled on the macOS runner.
      - name: Test (run-command supervisor)
        run: make app-test-supervisor

      # `build-agent_test.sh`'s universal cases need BOTH darwin targets installed and skip
      # themselves otherwise — and the step still prints OK, so the skip is invisible. Measured on
      # run 34783566140: "SKIP universal cases (rustup targets not installed)" followed by
      # "build-agent_test: OK". The wr-agent half of the guard below had therefore never run on a
      # PR, only on nightly/release, which install these before `make app-release`.
      #
      # Its Go sibling has no such gate (Go cross-compiles with no extra install), which is why the
      # asymmetry went unnoticed: `build-helper_test.sh` really was exercising the multi-arch path
      # on every PR while `build-agent_test.sh` quietly was not.
      #
      # `--toolchain stable` explicitly, because that is the toolchain the test's own
      # `rustup target list --installed --toolchain stable` query checks. A bare `rustup target add`
      # installs into the DEFAULT toolchain, which would leave the query — and so the skip —
      # unchanged if the default is ever not `stable`.
      #
      # The musl targets and cargo-zigbuild are the same gap for the Linux agents (#227): without
      # them the Linux case skips, and build-agent.sh's Linux branch would first run on a nightly.
      # `agent-linux` does not cover it, because it calls `cargo zigbuild` directly.
      - name: Install cross targets (for the universal-arch and Linux-agent script tests)
        run: |
          rustup target add --toolchain stable x86_64-apple-darwin aarch64-apple-darwin \
            aarch64-unknown-linux-musl x86_64-unknown-linux-musl
          cargo install cargo-zigbuild --locked --version 0.23.4

      # Shell-script tests. `make app-test` builds Debug with a single native arch, so it can never
      # exercise build-helper.sh's / build-agent.sh's multi-arch path — the branch whose absence
      # shipped an arm64-only CLI inside every universal .app. These run them directly with
      # ARCHS="arm64 x86_64".
      - name: Test (build + channel helper scripts)
        run: make app-test-scripts
