# MEASUREMENT ONLY, do not merge: app-scripts alone, build-agent_test on rust-cache's vcs/target.
name: CI

on:
  push:
    # `release/**` are the maintenance branches patch releases are cut from (CONTRIBUTING "Patch
    # releases"). They get the same gate as master — a v2.0.1 tag pushed there triggers a real
    # release, so it must not be the first CI that branch has seen.
    branches: [master, "release/**"]
  pull_request:
    branches: [master, "release/**"]

# Superseded PR pushes stop burning a macOS runner. Branch pushes keep every run so each commit a
# release can be cut from — on master or a `release/**` branch — has its own signal.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  app-scripts:
    runs-on: macos-15
    steps:
      # Full history, for the tags: agent-protocol_test.sh reads the latest stable release's app
      # protocol at its tag, and fails in a clone without them.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # build-helper_test.sh cross-compiles the workroom CLI.
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install Zig
        uses: ./.github/actions/install-zig
        with:
          version: "0.16.0"
          archive: aarch64-macos
          sha256: "b23d70deaa879b5c2d486ed3316f7eaa53e84acf6fc9cc747de152450d401489"

      - name: Cache libghostty-vt
        uses: actions/cache@v4
        with:
          path: ~/.cache/workroom/ghostty-vt
          key: ghostty-vt-${{ runner.os }}-${{ hashFiles('vcs/scripts/build-ghostty-vt.sh') }}

      - name: Cache cargo (agent)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: vcs
          key: app-scripts-warm-measure

      # `build-agent_test.sh`'s universal cases need BOTH darwin targets installed and skip
      # themselves otherwise — and the step still prints OK, so the skip is invisible. Measured on
      # run 34783566140: "SKIP universal cases (rustup targets not installed)" followed by
      # "build-agent_test: OK". The wr-agent half of the guard below had therefore never run on a
      # PR, only on nightly/release, which install these before `make app-release`.
      #
      # Its Go sibling has no such gate (Go cross-compiles with no extra install), which is why the
      # asymmetry went unnoticed: `build-helper_test.sh` really was exercising the multi-arch path
      # on every PR while `build-agent_test.sh` quietly was not.
      #
      # `--toolchain stable` explicitly, because that is the toolchain the test's own
      # `rustup target list --installed --toolchain stable` query checks. A bare `rustup target add`
      # installs into the DEFAULT toolchain, which would leave the query — and so the skip —
      # unchanged if the default is ever not `stable`.
      #
      # The musl targets and cargo-zigbuild are the same gap for the Linux agents (#227): without
      # them the Linux case skips, and build-agent.sh's Linux branch would first run on a nightly.
      # `agent-linux` does not cover it, because it calls `cargo zigbuild` directly.
      - name: Add rustup targets (for the universal-arch and Linux-agent script tests)
        run: |
          rustup target add --toolchain stable x86_64-apple-darwin aarch64-apple-darwin \
            aarch64-unknown-linux-musl x86_64-unknown-linux-musl

      # `cargo install` compiles cargo-zigbuild from source on every run (~1 minute). The binary is
      # all that is installed, so cache it on the pinned version.
      - name: Cache cargo-zigbuild
        id: zigbuild
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-zigbuild
          key: cargo-zigbuild-${{ runner.os }}-${{ runner.arch }}-0.23.4

      - name: Install cargo-zigbuild
        if: steps.zigbuild.outputs.cache-hit != 'true'
        run: cargo install cargo-zigbuild --locked --version 0.23.4

      # Shell-script tests. `make app-test` builds Debug with a single native arch, so it can never
      # exercise build-helper.sh's / build-agent.sh's multi-arch path — the branch whose absence
      # shipped an arm64-only CLI inside every universal .app. These run them directly with
      # ARCHS="arm64 x86_64".
      - name: Test (build + channel helper scripts)
        env:
          WR_TEST_CARGO_TARGET_DIR: ${{ github.workspace }}/vcs/target
        run: make app-test-scripts
