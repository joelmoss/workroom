name: CI

on:
  push:
    # `release/**` are the maintenance branches patch releases are cut from
    # (docs/contributing/releasing.md "Patch releases"). They get the same gate as master — a
    # v2.0.1 tag pushed there triggers a real release, so it must not be the first CI that branch
    # has seen.
    branches: [master, "release/**"]
  pull_request:
    branches: [master, "release/**"]

# Nothing is granted workflow-wide; each job asks for only what it uses.
permissions: {}

# Superseded PR pushes stop burning a macOS runner. Branch pushes keep every run so each commit a
# release can be cut from — on master or a `release/**` branch — has its own signal.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The jobs live in one workflow per language (ci-actions, ci-go, ci-rust, ci-app, ci-docs), called
# from here so that a pull request runs only the jobs its changes need: `changes` decides, from the
# diff. A push runs every job without asking it, so every commit a release can be cut from has the
# full signal, and so does the master push docs-deploy waits on.
#
# Filtered per job, not with `on.pull_request.paths`: a workflow that path filter skips never
# reports, and a required check waits on it forever, while a job skipped by its `if` reports as
# skipped, which a required check accepts. One workflow also keeps docs-deploy's `needs` on every
# job. So each call below always runs, and passes its jobs their filter as inputs: the checks keep
# their names, as "<call> / <job>" (`app / app`), whatever a change touches.
#
# The filter fails open. Each input is "not false", so if `changes` is skipped (every push), fails
# or reports nothing, every job runs; each call's `!cancelled()` lets it run past a skipped or
# failed `changes`.
jobs:
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      cli: ${{ steps.areas.outputs.cli }}
      rust: ${{ steps.areas.outputs.rust }}
      packages: ${{ steps.areas.outputs.packages }}
      app: ${{ steps.areas.outputs.app }}
      scripts: ${{ steps.areas.outputs.scripts }}
    steps:
      # A pull request's run checks out GitHub's merge commit: its first parent is the base
      # branch's tip, so the diff between the two is exactly what merging the PR would change.
      # A name-only diff reads only the two commits' trees, so no other blobs are fetched and only
      # the script is checked out.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
          filter: blob:none
          sparse-checkout: scripts/ci

      # `--no-renames`, so a file moved between trees names both sides: a rename shows only its
      # new path otherwise, and a file moved out of macapp/ would skip the app that lost it.
      - name: Classify the changed paths
        id: areas
        shell: bash
        run: |
          if paths="$(git diff --name-only --no-renames HEAD^1 HEAD)"; then
            printf 'Changed paths:\n%s\n' "$paths"
          else
            echo "No diff to read: every job runs."
            paths=""
          fi
          printf '%s\n' "$paths" | python3 scripts/ci/changed_areas.py | tee -a "$GITHUB_OUTPUT"

  actions:
    permissions:
      contents: read
    uses: ./.github/workflows/ci-actions.yml

  go:
    needs: changes
    if: ${{ !cancelled() }}
    permissions:
      contents: read
    uses: ./.github/workflows/ci-go.yml
    with:
      run: ${{ needs.changes.outputs.cli != 'false' }}

  rust:
    needs: changes
    if: ${{ !cancelled() }}
    permissions:
      contents: read
    uses: ./.github/workflows/ci-rust.yml
    with:
      run: ${{ needs.changes.outputs.rust != 'false' }}

  app:
    needs: changes
    if: ${{ !cancelled() }}
    permissions:
      contents: read
    uses: ./.github/workflows/ci-app.yml
    with:
      packages: ${{ needs.changes.outputs.packages != 'false' }}
      app: ${{ needs.changes.outputs.app != 'false' }}
      scripts: ${{ needs.changes.outputs.scripts != 'false' }}

  # `needs` lists every other call, so a red master never publishes; add a new one here too. Not
  # `changes`, which a push skips. The `if` checks the needs' results itself: the implicit
  # `success()` also skips a job when an ancestor of its needs was skipped (actions/runner#491), and
  # every push skips `changes`. A push runs every call, so none is skipped short of a cancel.
  docs:
    if: >-
      ${{ !cancelled()
      && !contains(needs.*.result, 'failure')
      && !contains(needs.*.result, 'cancelled')
      && github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    needs: [actions, go, rust, app]
    permissions: {}
    uses: ./.github/workflows/ci-docs.yml
    secrets:
      CODASET_DISPATCH_TOKEN: ${{ secrets.CODASET_DISPATCH_TOKEN }}
